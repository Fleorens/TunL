[package]
name = "tunl"
version = "0.1.0"
description = "A modern SSH, SFTP and RDP connection manager for Linux"
authors = ["Fleorens"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Fleorens/TunL"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tunl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2.9"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
thiserror = "2.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
ts-rs = { version = "12.0", features = ["serde-compat", "uuid-impl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
oo7 = "0.6"
zeroize = { version = "1.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.11", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
